name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Giai nen ban moi nhat
        run: |
          MOI=""; TG=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$TG" ]; then TG=${t:-0}; MOI="$f"; fi
          done
          echo "Dung file: $MOI"
          unzip -o -q "$MOI" -d .
          grep versionName app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Dong goi APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Phat hanh APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AutoChoiGame.apk
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" AutoChoiGame.apk --title "Auto Choi Game $TAG" --notes "Tai file AutoChoiGame.apk ben duoi de cai len dien thoai."
