name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen ma nguon
        run: |
          if [ -f source.zip ]; then unzip -o -q source.zip -d . ; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Dong goi APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Phat hanh APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AiChoiGame.apk
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" AiChoiGame.apk --title "AI Choi Game $TAG" --notes "Tai file AiChoiGame.apk ben duoi de cai len dien thoai."
